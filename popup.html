<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "EB Garamond";
        src: url("fonts/garamond.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }

      @font-face {
        font-family: "Figtree";
        src: url("fonts/figtree.woff2") format("woff2");
        font-weight: 300 900;
        font-display: block;
      }

      :root {
        --cream: #ffffeb;
        --ink: #1a1a1a;
        --lavender: #f0d7ff;
        --forest: #034f46;
        --fog: #8a8a80;
        --stone: #e4e4d0;

        --serif: "EB Garamond", Georgia, serif;
        --sans: "Figtree", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 380px;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.3;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- masthead ---------- */

      .masthead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 24px 0;
      }

      .wordmark {
        font-family: var(--serif);
        font-size: 24px;
        font-weight: 400;
      }

      /* Waveform pill: the system's busy indicator. Bars are pure CSS, so
         there is no timer to start, stop, or leak. */
      .wave {
        display: flex;
        align-items: center;
        gap: 3px;
        height: 28px;
        padding: 0 12px;
        border: 2px solid var(--ink);
        border-radius: 9999px;
      }

      .wave > i {
        width: 3px;
        height: 6px;
        background: var(--ink);
        border-radius: 1px;
        animation: pulse 0.9s ease-in-out infinite;
      }

      .wave > i:nth-child(2) {
        animation-delay: 0.12s;
      }
      .wave > i:nth-child(3) {
        animation-delay: 0.24s;
      }
      .wave > i:nth-child(4) {
        animation-delay: 0.36s;
      }
      .wave > i:nth-child(5) {
        animation-delay: 0.48s;
      }

      @keyframes pulse {
        0%,
        100% {
          height: 6px;
        }
        50% {
          height: 16px;
        }
      }

      /* ---------- state ---------- */

      .content {
        padding: 24px;
      }

      /* Authority comes from scale, not weight - this stays at 400. */
      #stateTitle {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 48px;
        line-height: 0.95;
        letter-spacing: -1.44px;
      }

      #status {
        margin-top: 10px;
        font-size: 16px;
        color: var(--fog);
        display: none;
        word-break: break-word;
      }

      #status.error {
        color: var(--ink);
        border-left: 2px solid var(--ink);
        padding-left: 12px;
      }

      /* Answer chips: the deliberately tight 8px radius, against a popup
         otherwise built from pills. */
      #answers {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 16px;
      }

      #answers:empty {
        display: none;
      }

      .chip {
        font-size: 14px;
        font-weight: 500;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--cream);
      }

      .chip.miss {
        background: transparent;
        color: var(--ink);
        border: 2px solid var(--ink);
        padding: 4px 8px;
      }

      .chip b {
        font-weight: 500;
        opacity: 0.5;
        margin-right: 5px;
      }

      /* ---------- actions ---------- */

      .actions {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .btn {
        width: 100%;
        padding: 16px 24px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn-cta {
        background: var(--lavender);
      }

      .btn:hover:not(:disabled) {
        background: var(--ink);
        color: var(--cream);
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Ghost/text button: no background, no border. */
      .link {
        background: none;
        border: none;
        padding: 0;
        font-family: var(--sans);
        font-size: 16px;
        color: var(--ink);
        cursor: pointer;
      }

      .link:hover:not(:disabled) {
        text-decoration: underline;
      }

      .link:disabled {
        color: var(--fog);
        cursor: not-allowed;
      }

      /* ---------- key ---------- */

      .key-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 2px solid var(--stone);
        font-size: 14px;
      }

      .key-left {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 10px;
        flex-shrink: 0;
        background: var(--fog);
      }

      .status-dot.active {
        background: var(--forest);
      }

      .status-text {
        color: var(--fog);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .key-bar .link {
        font-size: 14px;
        flex-shrink: 0;
      }

      .api-section {
        margin-top: 16px;
      }

      .api-section.hidden {
        display: none;
      }

      input[type="password"] {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--ink);
        border-radius: 12px;
        background: var(--cream);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
      }

      input::placeholder {
        color: var(--fog);
      }

      input:focus {
        outline: none;
      }

      .help {
        font-size: 14px;
        color: var(--fog);
        margin: 10px 0 14px;
      }

      .help a {
        color: var(--ink);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="masthead">
      <span class="wordmark">Solver</span>
      <div class="wave" id="wave" hidden>
        <i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <div class="content">
      <h1 id="stateTitle">Ready</h1>
      <div id="status"></div>
      <div id="answers"></div>

      <div id="mainActions" class="actions">
        <button class="btn btn-cta" id="solveBtn">Answer questions</button>
        <button class="link" id="copyBtn">Copy questions</button>
      </div>

 <div class="key-bar" id="apiStatusBar">
        <div class="key-left">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">No key</span>
        </div>
        <button class="link" id="changeApiBtn">Change</button>
      </div>

      <div id="apiSection" class="api-section hidden">
        <input type="password" id="apiKey" placeholder="Gemini API key" />
        <p class="help">
          Free key from
          <a href="https://aistudio.google.com/app/apikey" target="_blank"
            >Google AI Studio</a
          >
        </p>
        <button class="btn" id="saveApiBtn">Save</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
